name: Linux Self-Hosted Firefox Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/linux-selfhosted-firefox-build.yml"
      - "browser/**"
      - "toolkit/**"
      - "modules/**"
      - "mozconfig"

jobs:
  build-linux:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240

    steps:
      - name: Runner diagnostics
        shell: bash
        run: |
          set -eux
          date -u
          uname -a
          nproc
          df -h
          free -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
        env:
          GIT_TRACE: "1"
          GIT_TRACE_PERFORMANCE: "1"

      - name: Repository diagnostics
        shell: bash
        run: |
          set -eux
          git rev-parse --is-shallow-repository
          git rev-parse HEAD
          git show -s --oneline --decorate
          git count-objects -vH
          du -sh .

      - name: Show toolchain versions
        shell: bash
        run: |
          set -eux
          uname -a
          python3 --version
          node --version || true
          rustc --version || true
          cargo --version || true

      - name: Build
        shell: bash
        run: |
          set -eux
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Build started: ${start}"
          time ./mach --no-interactive build
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Build finished: ${end}"

      - name: Package
        shell: bash
        run: |
          set -eux
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Package started: ${start}"
          time ./mach --no-interactive package
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Package finished: ${end}"

      - name: Collect package artifacts
        shell: bash
        run: |
          set -eux
          mkdir -p artifacts
          find . -type f \
            \( -path "./obj-*/dist/*.tar.bz2" -o -path "./obj-*/dist/*.tar.xz" -o -path "./obj-*/dist/*.installer*.exe" \) \
            -exec cp -v {} artifacts/ \;
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firefox-linux-build
          path: artifacts/*
          if-no-files-found: error
