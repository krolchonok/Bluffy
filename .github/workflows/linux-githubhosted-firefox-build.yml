name: Linux GitHub-Hosted Firefox Build

on:
  workflow_dispatch:

jobs:
  build-linux-hosted:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Runner diagnostics
        shell: bash
        run: |
          set -eux
          date -u
          uname -a
          nproc
          df -h
          free -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
        env:
          GIT_TRACE: "1"
          GIT_TRACE_PERFORMANCE: "1"

      - name: Repository diagnostics
        shell: bash
        run: |
          set -eux
          git rev-parse --is-shallow-repository
          git rev-parse HEAD
          git show -s --oneline --decorate
          git count-objects -vH
          du -sh .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap build dependencies
        shell: bash
        run: |
          set -eux
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Build (full)
        shell: bash
        run: |
          set -eux
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Build started: ${start}"
          time ./mach --no-interactive build
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Build finished: ${end}"

      - name: Package
        shell: bash
        run: |
          set -eux
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Package started: ${start}"
          time ./mach --no-interactive package
          end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Package finished: ${end}"

      - name: Dist diagnostics
        shell: bash
        run: |
          set -eux
          TOPOBJDIR="$(./mach environment --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["topobjdir"])')"
          echo "TOPOBJDIR=${TOPOBJDIR}"
          ls -la "${TOPOBJDIR}/dist" || true
          find "${TOPOBJDIR}/dist" -maxdepth 2 -type f | sort || true

      - name: Collect package artifacts
        shell: bash
        run: |
          set -eux
          TOPOBJDIR="$(./mach environment --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["topobjdir"])')"
          mkdir -p artifacts
          find "${TOPOBJDIR}/dist" -maxdepth 3 -type f | sort > artifacts/dist-files.txt
          find "${TOPOBJDIR}/dist" -type f \
            \( -name "*.tar.bz2" -o -name "*.tar.xz" -o -name "*.tar.zst" -o -name "*.dmg" -o -name "*.apk" -o -name "*.installer*.exe" \) \
            -exec cp -v {} artifacts/ \;
          ls -la artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-linux-github-hosted-full-build
          path: artifacts
          if-no-files-found: warn
