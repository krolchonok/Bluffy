name: Linux GitHub-Hosted Firefox Build

on:
  workflow_dispatch:

jobs:
  build-linux-hosted:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap build dependencies
        shell: bash
        run: |
          set -eux
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Build
        shell: bash
        run: |
          set -eux
          ./mach --no-interactive build

      - name: Package
        shell: bash
        run: |
          set -eux
          ./mach --no-interactive package

      - name: Collect package artifacts
        shell: bash
        run: |
          set -eux
          mkdir -p artifacts
          find . -type f \
            \( -path "./obj-*/dist/*.tar.bz2" -o -path "./obj-*/dist/*.tar.xz" -o -path "./obj-*/dist/*.tar.zst" \) \
            -exec cp -v {} artifacts/ \;
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firefox-linux-github-hosted
          path: artifacts/*
          if-no-files-found: error
